# Description: ESPHome configuration for the ESP32 Air Quality Monitor
# https://github.com/SiloCityLabs/esp32-levoit-core300p/


# These substitutions allow the end user to override certain values
substitutions:
  name: "esp32-airquality-c6"
  friendly_name: "Air Quality Monitor C6"

  # If you deactivate this it also deactivates the improv_serial option. See here for more info: https://esphome.io/components/improv_serial
  log_level: "INFO"    

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  name_add_mac_suffix: true

  # This will allow for (future) project identification,
  # configuration and updates.
  project:
    name: silocitylabs.esp32-airquality-c6
    version: "1.3.0"

esp32:
  board: seeed_xiao_esp32c6
  framework:
    type: esp-idf

# Enable logging
logger:
  level: "${log_level}"

# API is a requirement of the dashboard import.
api:

# OTA is required for Over-the-Air updating
ota:
  id: ota_updater
  platform: esphome

# This should point to the public location of this yaml file.
dashboard_import:
  package_import_url: github://SiloCityLabs/esp32-airquality/esphome-v1.yaml@main
  import_full_config: true

wifi:
  ap:

# In combination with the `ap` this allows the user
# to provision wifi credentials to the device.
captive_portal:

# Sets up Bluetooth LE (Only on ESP32) to allow the user
# to provision wifi credentials to the device.
esp32_improv:
  authorizer: none

# Sets up the improv via serial client for Wi-Fi provisioning
improv_serial:

# Health sensors
sensor:
  - platform: wifi_signal
    id: esp_wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

text_sensor:
  - platform: template  # Human Readable Uptime
    name: Uptime
    id: uptime_human
    icon: mdi:clock-start

captive_portal:

i2c:
  id: esp_i2c
  sda: GPIO22 # D4
  scl: GPIO23 # D5
  scan: true

mpr121:
  id: mpr121_hub
  address: 0x5A

# --- PERSISTENT GLOBAL STATE TRACKING ---
globals:
  - id: g_is_locked
    type: bool
    initial_value: 'false'
  - id: g_leds_enabled
    type: bool
    initial_value: 'true'
  - id: g_fan_speed
    type: int
    restore_value: max
    initial_value: '0' # 0=Off, 1=Sleep, 2=Speed 1, 3=Speed 2, 4=Speed 3
  - id: g_last_active_speed
    type: int
    restore_value: max
    initial_value: '2' # Remembers last non-zero speed (Defaults to Speed 1)
  - id: g_timer_mode
    type: int
    initial_value: '0' # 0=Off, 1=2h, 2=4h, 3=6h, 4=8h
  - id: g_filter_runtime_seconds
    type: int
    restore_value: max
    initial_value: '0' # Accumulated motor runtime in seconds

# --- FILTER RUNTIME TRACKING INTERVAL ---
# Tracks active fan runtime and writes to persistent memory
interval:
  - interval: 60s
    then:
      - if:
          condition:
            lambda: 'return id(g_fan_speed) > 0;'
          then:
            - globals.set:
                id: g_filter_runtime_seconds
                value: !lambda 'return id(g_filter_runtime_seconds) + 60;'
            - script.execute: update_led_indicators

# --- HARDWARE RELAYS / FAN OUTPUTS ---
output:
  - platform: gpio
    pin: GPIO20 # D7
    id: output_sleep
  - platform: gpio
    pin: GPIO9  # D8
    id: output_speed_1
  - platform: gpio
    pin: GPIO8  # D9
    id: output_speed_2
  - platform: gpio
    pin: GPIO1  # D10
    id: output_speed_3

# --- HELPER SCRIPTS ---
script:
  - id: set_fan_speed
    parameters:
      target_speed: int
    then:
      - output.turn_off: output_sleep
      - output.turn_off: output_speed_1
      - output.turn_off: output_speed_2
      - output.turn_off: output_speed_3
      - globals.set:
          id: g_fan_speed
          value: !lambda 'return target_speed;'
      - lambda: |-
          switch(target_speed) {
            case 1: id(output_sleep).turn_on(); break;
            case 2: id(output_speed_1).turn_on(); break;
            case 3: id(output_speed_2).turn_on(); break;
            case 4: id(output_speed_3).turn_on(); break;
            default: break;
          }
      - script.execute: update_led_indicators

  - id: update_led_indicators
    then:
      - lambda: |-
          if (!id(g_leds_enabled)) {
            id(addressable_strip).turn_off().perform();
            return;
          }
          
          // Power status LED (U3)
          if (id(g_fan_speed) > 0) id(led_u3_power).turn_on().perform();
          else id(led_u3_power).turn_off().perform();

          // Speed LEDs (U4, U5, U14, U15, U16)
          id(led_u4_fan_on).set_state(id(g_fan_speed) > 0);
          id(led_u5_sleep).set_state(id(g_fan_speed) == 1);
          id(led_u14_speed1).set_state(id(g_fan_speed) == 2);
          id(led_u15_speed2).set_state(id(g_fan_speed) == 3);
          id(led_u16_speed3).set_state(id(g_fan_speed) == 4);

          // Timer LEDs (U6, U7, U8, U9, U10)
          id(led_u6_timer).set_state(id(g_timer_mode) > 0);
          id(led_u7_2h).set_state(id(g_timer_mode) == 1);
          id(led_u8_4h).set_state(id(g_timer_mode) == 2);
          id(led_u9_6h).set_state(id(g_timer_mode) == 3);
          id(led_u10_8h).set_state(id(g_timer_mode) == 4);

          // Control LEDs
          id(led_u11_leds_toggle).set_state(id(g_leds_enabled));
          id(led_u13_lock).set_state(id(g_is_locked));

          // Filter LED (U12) Warning Threshold Logic
          // 4000 hours = 14,400,000 seconds | 8000 hours = 28,800,000 seconds
          int runtime = id(g_filter_runtime_seconds);
          if (runtime >= 28800000) {
            // Blinking Red (> 8000 hours)
            auto call = id(led_u12_filter).turn_on();
            call.set_effect("Blink Red");
            call.perform();
          } else if (runtime >= 14400000) {
            // Solid Orange (> 4000 hours)
            auto call = id(led_u12_filter).turn_on();
            call.set_effect("None");
            call.set_rgb(1.0, 0.5, 0.0);
            call.perform();
          } else {
            // Off (< 4000 hours)
            id(led_u12_filter).turn_off().perform();
          }

# --- WS2812 LED STRIP & PARTITIONS ---
light:
  - platform: esp32_rmt_led_strip
    id: addressable_strip
    pin: GPIO21 # D6
    chipset: WS2812
    num_leds: 14
    rgb_order: GRB
    name: "Main LED Ring"

  - platform: partition
    id: led_u3_power
    name: "Power LED (U3)"
    segments: [{id: addressable_strip, from: 0, to: 0}]
  - platform: partition
    id: led_u4_fan_on
    name: "Fan Indicator (U4)"
    segments: [{id: addressable_strip, from: 1, to: 1}]
  - platform: partition
    id: led_u5_sleep
    name: "Sleep Indicator (U5)"
    segments: [{id: addressable_strip, from: 2, to: 2}]
  - platform: partition
    id: led_u6_timer
    name: "Timer Indicator (U6)"
    segments: [{id: addressable_strip, from: 3, to: 3}]
  - platform: partition
    id: led_u7_2h
    name: "2h Indicator (U7)"
    segments: [{id: addressable_strip, from: 4, to: 4}]
  - platform: partition
    id: led_u8_4h
    name: "4h Indicator (U8)"
    segments: [{id: addressable_strip, from: 5, to: 5}]
  - platform: partition
    id: led_u9_6h
    name: "6h Indicator (U9)"
    segments: [{id: addressable_strip, from: 6, to: 6}]
  - platform: partition
    id: led_u10_8h
    name: "8h Indicator (U10)"
    segments: [{id: addressable_strip, from: 7, to: 7}]
  - platform: partition
    id: led_u11_leds_toggle
    name: "LED Mode Indicator (U11)"
    segments: [{id: addressable_strip, from: 8, to: 8}]

  - platform: partition
    id: led_u12_filter
    name: "Filter Reset Indicator (U12)"
    segments: [{id: addressable_strip, from: 9, to: 9}]
    effects:
      - strobe:
          name: "Blink Red"
          colors:
            - state: true
              brightness: 100%
              red: 100%
              green: 0%
              blue: 0%
              duration: 500ms
            - state: false
              duration: 500ms

  - platform: partition
    id: led_u13_lock
    name: "Lock Indicator (U13)"
    segments: [{id: addressable_strip, from: 10, to: 10}]
  - platform: partition
    id: led_u14_speed1
    name: "Speed 1 Indicator (U14)"
    segments: [{id: addressable_strip, from: 11, to: 11}]
  - platform: partition
    id: led_u15_speed2
    name: "Speed 2 Indicator (U15)"
    segments: [{id: addressable_strip, from: 12, to: 12}]
  - platform: partition
    id: led_u16_speed3
    name: "Speed 3 Indicator (U16)"
    segments: [{id: addressable_strip, from: 13, to: 13}]

# --- CAPACITIVE TOUCH BUTTON CONTROLS ---
binary_sensor:
  # Lock Button (Channel 3) - Hold to toggle lock state
  - platform: mpr121
    mpr121_id: mpr121_hub
    channel: 3
    name: "Lock Button"
    id: button_lock
    on_multi_click:
      - timing:
          - ON for at least 1000ms
        then:
          - globals.set:
              id: g_is_locked
              value: !lambda 'return !id(g_is_locked);'
          - logger.log: "Lock State Toggled"
          - script.execute: update_led_indicators

  # Sleep Button (Channel 4)
  - platform: mpr121
    mpr121_id: mpr121_hub
    channel: 4
    name: "Sleep Button"
    id: button_sleep
    on_press:
      then:
        - if:
            condition:
              lambda: 'return !id(g_is_locked);'
            then:
              - script.execute:
                  id: set_fan_speed
                  target_speed: 1

  # Timer Button (Channel 5)
  - platform: mpr121
    mpr121_id: mpr121_hub
    channel: 5
    name: "Timer Button"
    id: button_timer
    on_press:
      then:
        - if:
            condition:
              lambda: 'return !id(g_is_locked);'
            then:
              - globals.set:
                  id: g_timer_mode
                  value: !lambda |-
                    int current = id(g_timer_mode);
                    return (current >= 4) ? 0 : current + 1;
              - script.execute: update_led_indicators

  # Filter Reset Button (Channel 6) - Hold to reset runtime counter
  - platform: mpr121
    mpr121_id: mpr121_hub
    channel: 6
    name: "Filter Reset Button"
    id: button_filter_reset
    on_multi_click:
      - timing:
          - ON for at least 1000ms
        then:
          - if:
              condition:
                lambda: 'return !id(g_is_locked);'
              then:
                - globals.set:
                    id: g_filter_runtime_seconds
                    value: '0'
                - logger.log: "Filter runtime timer reset to 0."
                - script.execute: update_led_indicators

  # LED On/Off Toggle (Channel 7)
  - platform: mpr121
    mpr121_id: mpr121_hub
    channel: 7
    name: "Lights Toggle Button"
    id: button_light
    on_press:
      then:
        - if:
            condition:
              lambda: 'return !id(g_is_locked);'
            then:
              - globals.set:
                  id: g_leds_enabled
                  value: !lambda 'return !id(g_leds_enabled);'
              - script.execute: update_led_indicators

  # Power Button (Channel 8)
  - platform: mpr121
    mpr121_id: mpr121_hub
    channel: 8
    name: "Power Button"
    id: button_power
    on_press:
      then:
        - if:
            condition:
              lambda: 'return !id(g_is_locked);'
            then:
              # Save current active speed before turning off
              - globals.set:
                  id: g_last_active_speed
                  value: !lambda 'return id(g_fan_speed);'
              - script.execute:
                  id: set_fan_speed
                  target_speed: 0
              else:
              # Resume last active speed (or default to 2 if invalid)
              - script.execute:
                  id: set_fan_speed
                  target_speed: !lambda |-
                    int target = id(g_last_active_speed);
                    return (target >= 1 && target <= 4) ? target : 2;

  # Fan Speed Cycle Button (Channel 9)
  - platform: mpr121
    mpr121_id: mpr121_hub
    channel: 9
    name: "Fan Speed Button"
    id: button_fan_speed
    on_press:
      then:
        - if:
            condition:
              lambda: 'return !id(g_is_locked);'
            then:
              - globals.set:
                  id: g_fan_speed
                  value: !lambda |-
                    int next_speed = id(g_fan_speed) + 1;
                    return (next_speed > 4) ? 2 : next_speed;
              - script.execute:
                  id: set_fan_speed
                  target_speed: !lambda 'return id(g_fan_speed);'