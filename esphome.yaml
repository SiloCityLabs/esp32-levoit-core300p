# Description: ESPHome configuration for the ESP32 Air Quality Monitor
# https://github.com/SiloCityLabs/esp32-levoit-core300p/


# These substitutions allow the end user to override certain values
substitutions:
  name: "esp32-levoit-core300p"
  friendly_name: "Fan controller for Levoit Core 300 P"

  # If you deactivate this it also deactivates the improv_serial option. See here for more info: https://esphome.io/components/improv_serial
  log_level: "INFO"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  name_add_mac_suffix: true

  # This will allow for (future) project identification,
  # configuration and updates.
  project:
    name: silocitylabs.esp32-levoit-core300p
    version: "1.3.0"

esp32:
  board: seeed_xiao_esp32c6
  framework:
    type: esp-idf

# Enable logging
logger:
  level: "${log_level}"

# API is a requirement of the dashboard import.
api:

# OTA is required for Over-the-Air updating
ota:
  id: ota_updater
  platform: esphome

# This should point to the public location of this yaml file.
dashboard_import:
  package_import_url: github://SiloCityLabs/esp32-levoit-core300p/esphome.yaml@main
  import_full_config: true

wifi:
  ap:

# In combination with the `ap` this allows the user
# to provision wifi credentials to the device.
captive_portal:

# Sets up Bluetooth LE (Only on ESP32) to allow the user
# to provision wifi credentials to the device.
esp32_improv:
  authorizer: none

# Sets up the improv via serial client for Wi-Fi provisioning
improv_serial:

# Health sensors
sensor:
  - platform: wifi_signal
    id: esp_wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

text_sensor:
  - platform: template  # Human Readable Uptime
    name: Uptime
    id: uptime_human
    icon: mdi:clock-start

i2c:
  id: esp_i2c
  sda: GPIO22 # D4
  scl: GPIO23 # D5
  scan: true
  frequency: 400kHz

mpr121:
  id: mpr121_hub
  address: 0x5A
  touch_threshold: 8
  release_threshold: 5

# button entities accessible in ESPHome
# restarts ESP32
button:
  - platform: restart
    id: restart_button
    icon: mdi:power-cycle
    name: "ESP Reboot"
# child lock
switch:
  - platform: template
    id: child_lock_button
    name: "Child Lock"
    icon: "mid:lock"
    # id(child_lock_button).state
    turn_on_action:
      - logger.log: "Child lock toggled"
      - script.execute: update_led_indicators
    turn_off_action:
      - logger.log: "Child lock toggled"
      - script.execute: update_led_indicators

# --- PERSISTENT GLOBAL STATE TRACKING ---
globals:
  - id: g_is_locked
    type: bool
    initial_value: 'false'
  - id: g_is_child_locked
    type: bool
    initial_value: 'false'
  - id: g_led_brightness
    type: int
    restore_value: true
    initial_value: '100' # 0=Off, 10, 25, 50, 100
  - id: g_fan_speed
    type: int
    restore_value: true
    initial_value: '0' # 0=Off, 1=Sleep, 2=Speed 1, 3=Speed 2, 4=Speed 3
  - id: g_last_active_speed
    type: int
    restore_value: true
    initial_value: '2' # Remembers last non-zero speed (Defaults to Speed 1)
  - id: g_timer_mode
    type: int
    initial_value: '0' # 0=Off, 1=2h, 2=4h, 3=6h, 4=8h
  - id: g_filter_runtime_seconds
    type: int
    restore_value: true
    initial_value: '0' # Accumulated motor runtime in seconds

# --- FILTER RUNTIME TRACKING INTERVAL ---
# Tracks active fan runtime and writes to persistent memory
interval:
  - interval: 60s
    then:
      - if:
          condition:
            lambda: 'return id(g_fan_speed) > 0;'
          then:
            - globals.set:
                id: g_filter_runtime_seconds
                value: !lambda 'return id(g_filter_runtime_seconds) + 60;'
            - script.execute: update_led_indicators

# --- HARDWARE RELAYS / FAN OUTPUTS ---
output:
  - platform: gpio
    pin: GPIO17 # D7
    id: output_sleep
  # Pin map from observed hardware
  # GPIO18 = low, GPIO19 = medium, GPIO20 = high
  - platform: gpio
    pin: GPIO18  # D10
    id: output_speed_1
  - platform: gpio
    pin: GPIO19  # D8
    id: output_speed_2
  - platform: gpio
    pin: GPIO20  # D9
    id: output_speed_3

# --- HELPER SCRIPTS ---
# mode: restart so rapid button presses aren't dropped while LEDs update
script:
  - id: set_fan_speed
    mode: restart
    parameters:
      target_speed: int
    then:
      - output.turn_off: output_sleep
      - output.turn_off: output_speed_1
      - output.turn_off: output_speed_2
      - output.turn_off: output_speed_3
      - globals.set:
          id: g_fan_speed
          value: !lambda 'return target_speed;'
      - globals.set:
          id: g_last_active_speed
          value: !lambda 'return (target_speed > 0) ? target_speed : id(g_last_active_speed);'
      - lambda: |-
          switch(target_speed) {
            case 1: id(output_sleep).turn_on(); break;
            case 2: id(output_speed_1).turn_on(); break;
            case 3: id(output_speed_2).turn_on(); break;
            case 4: id(output_speed_3).turn_on(); break;
            default: break;
          }
      - script.execute: update_led_indicators

  # Paint the whole WS2812 strip in one write instead of N partition perform()s.
  # Partition lights are kept for HA visibility + pulse/blink effects only.
  - id: update_led_indicators
    mode: restart
    then:
      - lambda: |-
          auto *strip = static_cast<light::AddressableLight *>(
              id(addressable_strip).get_output());
          const int bri_pct = id(g_led_brightness);
          const float bri = bri_pct / 100.0f;
          const bool leds_on = bri_pct > 0;
          const Color OFF = Color::BLACK;
          const Color ON = Color(255, 255, 255);
          const Color GREEN = Color(0, 255, 0);
          const Color ORANGE = Color(255, 128, 0);

          auto ensure_strip_on = [bri]() {
            auto call = id(addressable_strip).turn_on();
            call.set_brightness(bri);
            call.set_effect("None");
            call.perform();
          };

          auto strip_off = []() {
            auto call = id(addressable_strip).turn_off();
            call.set_transition_length(0);
            call.perform();
          };

          // Power OFF: clear strip, optional slow-pulse red on power LED.
          if (id(g_fan_speed) == 0) {
            strip_off();
            {
              auto call = id(led_filter).turn_off();
              call.set_transition_length(0);
              call.perform();
            }
            if (!leds_on) {
              auto call = id(led_power).turn_off();
              call.set_transition_length(0);
              call.perform();
              return;
            }
            // Do not set transition_length with an effect — ESPHome rejects that combo.
            auto p = id(led_power).turn_on();
            p.set_rgb(1.0, 0.0, 0.0);
            p.set_brightness(bri);
            p.set_effect("Slow Pulse Red");
            p.perform();
            return;
          }

          // Power ON but LEDs at 0% brightness.
          if (!leds_on) {
            strip_off();
            return;
          }

          // Power ON + LEDs enabled: one buffer paint + one schedule_show.
          ensure_strip_on();
          // Stop power-off pulse effect so it doesn't keep overwriting index 0.
          {
            auto call = id(led_power).turn_on();
            call.set_effect("None");
            call.perform();
          }
          strip->all() = OFF;

          // Index map matches partition segments below.
          strip->get(0) = GREEN;  // power
          strip->get(1) = (id(g_is_locked) || id(child_lock_button).state) ? ON : OFF;  // lock
          // filter (index 2) handled below
          strip->get(3) = ON;  // leds brightness indicator (on when > 0%)
          strip->get(4) = (id(g_timer_mode) == 4) ? ON : OFF;  // 8h
          strip->get(5) = (id(g_timer_mode) == 3) ? ON : OFF;  // 6h
          strip->get(6) = (id(g_timer_mode) == 2) ? ON : OFF;  // 4h
          strip->get(7) = (id(g_timer_mode) == 1) ? ON : OFF;  // 2h
          strip->get(8) = (id(g_timer_mode) > 0) ? ON : OFF;   // timer
          strip->get(9) = (id(g_fan_speed) == 1) ? ON : OFF;    // sleep
          strip->get(10) = (id(g_fan_speed) > 0) ? ON : OFF;    // fan on
          strip->get(11) = (id(g_fan_speed) == 3) ? ON : OFF;   // speed 2
          strip->get(12) = (id(g_fan_speed) == 4) ? ON : OFF;   // speed 3
          strip->get(13) = (id(g_fan_speed) == 2) ? ON : OFF;   // speed 1

          int runtime = id(g_filter_runtime_seconds);
          if (runtime >= 28800000) {
            // Flush static LEDs, then let the partition effect own index 2.
            strip->schedule_show();
            auto call = id(led_filter).turn_on();
            call.set_effect("Blink Red");
            call.set_brightness(bri);
            call.perform();
          } else {
            // Stop any blink effect, then paint solid orange / off in the buffer.
            {
              auto call = id(led_filter).turn_off();
              call.set_transition_length(0);
              call.perform();
            }
            strip->get(2) = (runtime >= 14400000) ? ORANGE : OFF;
            strip->schedule_show();
          }

# --- WS2812 LED STRIP & PARTITIONS ---
light:
  - platform: esp32_rmt_led_strip
    name: "Main LED Ring"
    pin: GPIO16  # D6
    id: addressable_strip
    chipset: WS2812
    num_leds: 14
    rgb_order: GRB
    default_transition_length: 0s
  - platform: partition
    id: led_power
    name: "Power LED" # U3
    default_transition_length: 0s
    segments: [{id: addressable_strip, from: 0, to: 0}]
    effects:
      - pulse:
          name: "Slow Pulse Red"
          transition_length: 3s
          update_interval: 3s
          min_brightness: 0%
          max_brightness: 50%
  - platform: partition
    id: led_fan_on
    name: "Fan Indicator" # U4
    segments: [{id: addressable_strip, from: 10, to: 10}]
  - platform: partition
    id: led_sleep
    name: "Sleep Indicator" # U5
    segments: [{id: addressable_strip, from: 9, to: 9}]
  - platform: partition
    id: led_timer
    name: "Timer Indicator" # U6
    segments: [{id: addressable_strip, from: 8, to: 8}]
  - platform: partition
    id: led_2h
    name: "2h Indicator" # U7
    segments: [{id: addressable_strip, from: 7, to: 7}]
  - platform: partition
    id: led_4h
    name: "4h Indicator" # U8
    segments: [{id: addressable_strip, from: 6, to: 6}]
  - platform: partition
    id: led_6h
    name: "6h Indicator" # U9
    segments: [{id: addressable_strip, from: 5, to: 5}]
  - platform: partition
    id: led_8h
    name: "8h Indicator" # U10
    segments: [{id: addressable_strip, from: 4, to: 4}]
  - platform: partition
    id: led_leds_toggle
    name: "LED Mode Indicator" # U11
    segments: [{id: addressable_strip, from: 3, to: 3}]
  - platform: partition
    id: led_filter
    name: "Filter Reset Indicator" # U12
    default_transition_length: 0s
    segments: [{id: addressable_strip, from: 2, to: 2}]
    effects:
      - strobe:
          name: "Blink Red"
          colors:
            - state: true
              brightness: 100%
              red: 100%
              green: 0%
              blue: 0%
              duration: 500ms
            - state: false
              duration: 500ms
  - platform: partition
    id: led_lock
    name: "Lock Indicator" # U13
    segments: [{id: addressable_strip, from: 1, to: 1}]
  - platform: partition
    id: led_speed3
    name: "Speed 3 Indicator"
    segments: [{id: addressable_strip, from: 12, to: 12}]
  - platform: partition
    id: led_speed2
    name: "Speed 2 Indicator"
    segments: [{id: addressable_strip, from: 11, to: 11}]
  - platform: partition
    id: led_speed1
    name: "Speed 1 Indicator"
    segments: [{id: addressable_strip, from: 13, to: 13}]

# --- CAPACITIVE TOUCH BUTTON CONTROLS ---
binary_sensor:
  # Lock Button (Channel 9) - Hold to toggle lock state
  - platform: mpr121
    mpr121_id: mpr121_hub
    channel: 9
    name: "Lock Button"
    id: button_lock
    on_press:
      then:
        - logger.log:
            level: INFO
            format: "Button press channel 9 (lock)"
    on_click:
      - min_length: 2000ms
        max_length: 5000ms
        then:
          - if:
              condition:
                lambda: 'return !id(child_lock_button).state;'
              then:
                - globals.set:
                    id: g_is_locked
                    value: !lambda 'return !id(g_is_locked);'
                - logger.log:
                    level: INFO
                    format: "Lock State Toggled"
                - script.execute: update_led_indicators

  # Sleep Button (Channel 3)
  - platform: mpr121
    mpr121_id: mpr121_hub
    channel: 3
    name: "Sleep Button"
    id: button_sleep
    on_press:
      then:
        - logger.log:
            level: INFO
            format: "Button press channel 3 (sleep)"
        - if:
            condition:
              lambda: 'return !id(child_lock_button).state && !id(g_is_locked) && id(g_fan_speed) > 0;'
            then:
              - script.execute:
                  id: set_fan_speed
                  target_speed: 1

  # Timer Button (Channel 7)
  - platform: mpr121
    mpr121_id: mpr121_hub
    channel: 7
    name: "Timer Button"
    id: button_timer
    on_press:
      then:
        - logger.log:
            level: INFO
            format: "Button press channel 7 (timer) locked=%d child_lock=%d fan=%d mode=%d"
            args:
              - 'id(g_is_locked)'
              - 'id(child_lock_button).state'
              - 'id(g_fan_speed)'
              - 'id(g_timer_mode)'
        - if:
            condition:
              lambda: 'return !id(child_lock_button).state && !id(g_is_locked) && id(g_fan_speed) > 0;'
            then:
              - globals.set:
                  id: g_timer_mode
                  value: !lambda |-
                    int current = id(g_timer_mode);
                    return (current >= 4) ? 0 : current + 1;
              - logger.log:
                  level: INFO
                  format: "Timer mode set to %d (0=off,1=2h,2=4h,3=6h,4=8h)"
                  args: ['id(g_timer_mode)']
              - script.execute: update_led_indicators
            else:
              - logger.log:
                  level: WARN
                  format: "Timer ignored (need unlocked + fan on)"

  # Filter Reset Button (Channel 4) - Hold to reset runtime counter
  - platform: mpr121
    mpr121_id: mpr121_hub
    channel: 4
    name: "Filter Reset Button"
    id: button_filter_reset
    on_press:
      then:
        - logger.log:
            level: INFO
            format: "Button press channel 4 (filter) runtime=%ds — hold 5s to reset"
            args: ['id(g_filter_runtime_seconds)']
    on_release:
      then:
        - logger.log:
            level: INFO
            format: "Filter button released (hold must reach 5s to reset)"
    on_multi_click:
      - timing:
          - ON for at least 5000ms
        then:
          - logger.log:
              level: INFO
              format: "Filter hold detected (5s+) locked=%d child_lock=%d fan=%d runtime=%ds"
              args:
                - 'id(g_is_locked)'
                - 'id(child_lock_button).state'
                - 'id(g_fan_speed)'
                - 'id(g_filter_runtime_seconds)'
          - if:
              condition:
                lambda: 'return !id(child_lock_button).state && !id(g_is_locked) && id(g_fan_speed) > 0;'
              then:
                - globals.set:
                    id: g_filter_runtime_seconds
                    value: '0'
                - logger.log:
                    level: INFO
                    format: "Filter runtime reset to 0."
                - script.execute: update_led_indicators
              else:
                - logger.log:
                    level: WARN
                    format: "Filter reset ignored (need unlocked + fan on)"

  # LED Brightness Cycle (Channel 5): 0% -> 10% -> 25% -> 50% -> 100% -> 0%
  - platform: mpr121
    mpr121_id: mpr121_hub
    channel: 5
    name: "Lights Toggle Button"
    id: button_light
    on_press:
      then:
        - logger.log:
            level: INFO
            format: "Button press channel 5 (light)"
        - if:
            condition:
              lambda: 'return !id(child_lock_button).state && !id(g_is_locked) && id(g_fan_speed) > 0;'
            then:
              - globals.set:
                  id: g_led_brightness
                  value: !lambda |-
                    const int levels[] = {0, 10, 25, 50, 100};
                    const int cur = id(g_led_brightness);
                    for (int i = 0; i < 5; i++) {
                      if (cur == levels[i])
                        return levels[(i + 1) % 5];
                    }
                    return 100;
              - logger.log:
                  level: INFO
                  format: "LED brightness set to %d%%"
                  args: ['id(g_led_brightness)']
              - script.execute: update_led_indicators

  # Power Button (Channel 8)
  - platform: mpr121
    mpr121_id: mpr121_hub
    channel: 8
    name: "Power Button"
    id: button_power
    on_press:
      then:
        - logger.log:
            level: INFO
            format: "Button press channel 8 (power)"
        - if:
            condition:
              lambda: 'return !id(child_lock_button).state && !id(g_is_locked);'
            then:
              - if:
                  condition:
                    lambda: 'return id(g_fan_speed) > 0;'
                  then:
                    - logger.log:
                        level: INFO
                        format: "Power Off"
                    - globals.set:
                        id: g_last_active_speed
                        value: !lambda 'return (id(g_fan_speed) > 0) ? id(g_fan_speed) : id(g_last_active_speed);'
                    - script.execute:
                        id: set_fan_speed
                        target_speed: 0
                  else:
                    - logger.log:
                        level: INFO
                        format: "Power On"
                    - script.execute:
                        id: set_fan_speed
                        target_speed: !lambda |-
                          int target = id(g_last_active_speed);
                          return (target >= 1 && target <= 4) ? target : 2;
  # Fan Speed Cycle Button (Channel 6)
  - platform: mpr121
    mpr121_id: mpr121_hub
    channel: 6
    name: "Fan Speed Button"
    id: button_fan_speed
    on_press:
      then:
        - logger.log:
            level: INFO
            format: "Button press channel 6 (fan)"
        - if:
            condition:
              lambda: 'return !id(child_lock_button).state && !id(g_is_locked) && id(g_fan_speed) > 0;'
            then:
              - script.execute:
                  id: set_fan_speed
                  target_speed: !lambda |-
                    // Cycle low -> medium -> high (2->3->4->2).
                    // From sleep/off, jump to low.
                    int cur = id(g_fan_speed);
                    if (cur < 2 || cur >= 4) return 2;
                    return cur + 1;